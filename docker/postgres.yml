# O banco, sozinho.
#
#   docker compose -f docker/postgres.yml up -d
#   docker compose -f docker/postgres.yml down        # o volume FICA
#
# Compose próprio, volume próprio, ciclo de vida próprio — de propósito. O banco
# sobrevive a rebuild da aplicação, e derrubar a aplicação não pode derrubar
# dado. É a mesma razão de o MinIO ter o dele.
#
# **Veio do `entendo-postgres`?** O projeto se chamava entendo até novembro de
# 2026. O banco foi COPIADO (pg_dump/pg_restore) para o volume novo abaixo, e o
# antigo ficou parado como cópia de segurança — docs/operacao.md, "Migração do
# nome", tem o passo a passo e quando apagar o velho.
#
# As migrations continuam sendo aplicadas à mão (`pnpm db:migrate`) — subir o
# container não migra nada.

# **Os limites são de um servidor real: 4 vCPU, 16 GB.** Eles não estão aqui
# para economizar, e sim para que nenhum processo consiga derrubar os outros —
# num servidor pequeno o que mata é um container sozinho comendo a máquina, não
# a soma dos quatro. Os tetos de CPU somam mais que 4 de propósito: são teto, não
# reserva, e os picos não acontecem juntos. Os de MEMÓRIA somam menos que 16, que
# é o número que precisa fechar.

name: spokke-postgres

services:
  postgres:
    image: postgres:16
    container_name: spokke-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-spokke}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-spokke}']
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

volumes:
  # Nome FIXO, e não o `spokke-postgres_dados` que o compose geraria: o nome do
  # volume não pode depender do nome do projeto do compose, senão renomear o
  # projeto recomeçaria o banco vazio.
  dados:
    name: spokke-postgres-data
