# O object storage, sozinho.
#
#   docker compose -f docker/minio.yml up -d
#   docker compose -f docker/minio.yml down           # o volume FICA
#
# Compose próprio e volume próprio, como o Postgres: o áudio de uma atividade
# publicada não pode sumir porque a aplicação foi reconstruída.
#
# Em produção o storage continua sendo o R2 preferido de server.md — este arquivo
# é o equivalente local dele, INCLUSIVE a regra de ciclo de vida.
#
# **A imagem é a SILO (`pgsty/silo`), não a `minio/minio`.** A MinIO parou de
# publicar imagem em 2025 e as do Docker Hub sumiram em setembro de 2026 ("pull
# access denied"); a SILO é o fork mantido pela PGSTY, com as mesmas variáveis
# `MINIO_*`, o mesmo `server /data` e o mesmo formato de dados. O cliente vem
# dentro dela (`mc` aponta para o `mcli`), então o `init` usa a mesma imagem.
# Versão FIXA: subir de versão é trocar a tag aqui, de propósito.

# **Os limites são de um servidor real: 4 vCPU, 16 GB.** Eles não estão aqui
# para economizar, e sim para que nenhum processo consiga derrubar os outros —
# num servidor pequeno o que mata é um container sozinho comendo a máquina, não
# a soma dos quatro. Os tetos de CPU somam mais que 4 de propósito: são teto, não
# reserva, e os picos não acontecem juntos. Os de MEMÓRIA somam menos que 16, que
# é o número que precisa fechar.

name: spokke-minio

services:
  minio:
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    container_name: spokke-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-spokke}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-spokke-dev-secret}
    ports:
      # 9000 é a API S3 — é por ela que o worker grava e que o BROWSER do aluno
      # baixa o áudio. 9001 é o painel, só para olhar o bucket em dev.
      - '${STORAGE_PORT:-9000}:9000'
      - '${STORAGE_CONSOLE_PORT:-9001}:9001'
    volumes:
      - dados:/data
    healthcheck:
      # A sonda própria da SILO. `mc ready` não serve: ele espera para sempre
      # até o servidor responder, em vez de dizer "ainda não".
      test: ['CMD', 'silo', 'healthcheck', 'ready']
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          # Servir arquivo estático é barato; o que ele mais faz é I/O.
          cpus: '0.5'
          memory: 1G

  # Cria o bucket e escreve a REGRA DE CICLO DE VIDA. Roda até o fim e sai — não
  # é um serviço de pé.
  init:
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    container_name: spokke-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      CHAVE: ${STORAGE_ACCESS_KEY_ID:-spokke}
      SEGREDO: ${STORAGE_SECRET_ACCESS_KEY:-spokke-dev-secret}
      BUCKET: ${STORAGE_BUCKET:-spokke-midia}
    entrypoint: ['/bin/sh', '-c']
    # `$$` escapa a interpolação do compose: quem lê estas variáveis é o shell
    # dentro do container, não o arquivo aqui.
    command:
      - |
        set -e
        mc alias set spokke http://minio:9000 "$$CHAVE" "$$SEGREDO"
        mc mb --ignore-existing "spokke/$$BUCKET"

        # Leitura anônima SÓ no prefixo `tts/`. O áudio é o mesmo conteúdo que o
        # aluno recebe na questão e o browser dele baixa a URL direto — mas o
        # resto do bucket não tem por que ser público.
        #
        # **`fala/` fica de fora, e isso é a metade da proteção.** Ali está a voz
        # de alunos: pública, bastaria adivinhar o endereço. Quem serve aquele
        # áudio é uma rota do Studio que confere se o professor é dono da
        # tentativa.
        mc anonymous set download "spokke/$$BUCKET/tts"

        # **Um prazo de vida, do lado do MinIO.** É a expiração nativa do S3
        # (ILM): o servidor apaga sozinho, sem job nosso varrendo bucket.
        #
        # `fala/` são 7 dias — a gravação do aluno, que é a voz de uma pessoa e
        # NÃO se recria; ela fica o mínimo que ainda serve para o professor dar
        # retorno. O mesmo prazo está em `FALA_DIAS_DE_VIDA`
        # (`server/tts/index.ts`), que grava a coluna de expiração.
        #
        # **`tts/` não tem regra, de propósito.** O áudio de atividade vivia 10
        # dias e passou a ficar enquanto alguma atividade do professor o usa —
        # quem apaga é `server/tts/limpeza.ts`, quando a atividade sai.
        #
        # `import` REESCREVE a configuração inteira, e é por isso que ele está
        # aqui e não um `rule add`: subir o compose de novo não pode empilhar uma
        # segunda regra igual — e é o que TIRA a regra antiga de `tts/` de um
        # bucket que já a tinha.
        cat > /tmp/ciclo-de-vida.json <<'JSON'
        {
          "Rules": [
            {
              "ID": "fala-do-aluno-7-dias",
              "Status": "Enabled",
              "Filter": { "Prefix": "fala/" },
              "Expiration": { "Days": 7 }
            }
          ]
        }
        JSON
        mc ilm rule import "spokke/$$BUCKET" < /tmp/ciclo-de-vida.json \
          || mc ilm import "spokke/$$BUCKET" < /tmp/ciclo-de-vida.json

        echo "--- ciclo de vida de spokke/$$BUCKET ---"
        mc ilm rule ls "spokke/$$BUCKET" || mc ilm ls "spokke/$$BUCKET"

volumes:
  dados:
    name: spokke-minio-data
